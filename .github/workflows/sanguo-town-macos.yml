name: Sanguo Town macOS
on:
  push:
    paths: ['sanguo-town/Sources/**','sanguo-town/Tests/**','sanguo-town/Package.swift','sanguo-town/scripts/**','sanguo-town/spec/**','.github/workflows/sanguo-town-macos.yml']
  pull_request:
    paths: ['sanguo-town/Sources/**','sanguo-town/Tests/**','sanguo-town/Package.swift','sanguo-town/scripts/**','sanguo-town/spec/**','.github/workflows/sanguo-town-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanguo-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sanguo-town
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Environment and bundled configuration consistency
        run: |
          set -euo pipefail
          mkdir -p dist/logs
          { sw_vers; uname -m; xcodebuild -version; swift --version; } | tee dist/logs/environment.txt
          test "$(uname -m)" = arm64
          python3 scripts/export_life_catalog.py --check | tee dist/logs/catalog.txt
          python3 scripts/test_slim_v072.py --output dist/slim-spec 2>&1 | tee dist/logs/slim-spec.txt
      - name: Debug runtime tests and native client
        run: |
          set -euo pipefail
          swift test 2>&1 | tee dist/logs/debug-test.txt
          swift build --product SanguoMac 2>&1 | tee dist/logs/macos-build.txt
      - name: Release runtime tests
        run: |
          set -euo pipefail
          swift test -c release 2>&1 | tee dist/logs/release-test.txt
      - name: Actual life runtime and visit-cadence comparison
        run: |
          set -euo pipefail
          swift run -c release SanguoLifeCLI --seconds 86400 --cadence 120 --seal --output dist/life-day1 2>&1 | tee dist/logs/life-day1.txt
          swift run -c release SanguoLifeCLI --seconds 86400 --cadence 86400 --seal --output dist/life-once 2>&1 | tee dist/logs/life-once.txt
          cmp dist/life-day1/world.json dist/life-once/world.json
      - name: Husbandry, actual meat meals and seven-day regression
        run: |
          set -euo pipefail
          swift run -c release SanguoLifeCLI --husbandry --seal --seconds 86400 --cadence 120 --preview --output dist/food-day1 2>&1 | tee dist/logs/food-day1.txt
          swift run -c release SanguoLifeCLI --husbandry --seal --seconds 86400 --cadence 86400 --output dist/food-once 2>&1 | tee dist/logs/food-once.txt
          cmp dist/food-day1/world.json dist/food-once/world.json
          swift run -c release SanguoLifeCLI --husbandry --seal --seconds 604800 --cadence 86400 --output dist/food-week 2>&1 | tee dist/logs/food-week.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for name in ('food-day1', 'food-week'):
              root=Path('dist')/name
              w=json.loads((root/'world.json').read_text())
              s=json.loads((root/'food-status.json').read_text())
              assert s['pigsProcessed'] > 0 and s['heartyMealsConsumed'] > 0
              assert s['heartyMealsConsumed'] <= s['mealsConsumed']
              assert s['meatProduced'] == s['pigsProcessed'] * 8000
              assert s['purchaseSpent'] <= s['purchaseLimit']
              rows.append({'scenario':name, 'time':w['time'], 'population':len(w['agents']), 'treasury':w['treasury'], 'food':s})
          previous=json.loads(Path('dist/life-day1/food-status.json').read_text())
          assert previous['enabled'] is False and previous['pigsProcessed'] == 0
          Path('dist/food-scenarios.json').write_text(json.dumps({'scope':'actual Swift scenarios; not full PRD acceptance or 90-day balance', 'cadence_byte_equal':True, 'rows':rows},ensure_ascii=False,indent=2))
          PY
      - name: Build and verify portable development bundle
        run: |
          set -euo pipefail
          bash scripts/build-macos.sh 2>&1 | tee dist/logs/app-build.txt
          mkdir -p /tmp/sanguo-relocated
          ditto dist/SanguoTown-Development.app /tmp/sanguo-relocated/SanguoTown-Development.app
          (cd /tmp; /tmp/sanguo-relocated/SanguoTown-Development.app/Contents/MacOS/SanguoMac --life-catalog-check) | tee dist/logs/relocated-bundle.txt
          codesign --verify --deep --strict /tmp/sanguo-relocated/SanguoTown-Development.app
          ditto -c -k --keepParent dist/SanguoTown-Development.app dist/SanguoTown-Development.zip
          git -C .. archive --format=zip --output=sanguo-town/dist/source.zip HEAD sanguo-town .github/workflows/sanguo-town-macos.yml
      - name: Preserve real logs and development artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sanguo-macos-${{ github.sha }}
          path: |
            sanguo-town/dist/logs
            sanguo-town/dist/slim-spec
            sanguo-town/dist/source.zip
            sanguo-town/dist/life-day1
            sanguo-town/dist/food-day1
            sanguo-town/dist/food-week
            sanguo-town/dist/food-scenarios.json
            sanguo-town/dist/SanguoTown-Development.zip
          retention-days: 14
          if-no-files-found: warn
