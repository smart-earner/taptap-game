name: Sanguo Life v072 playable integration
on:
  push:
    branches: ['feat/sanguo-life-runtime-v072']
    paths: ['.github/workflows/sanguo-life-v072-ui-integrate.yml']
permissions:
  contents: write
concurrency:
  group: sanguo-life-v072-ui-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact patch and apply to tested runtime
        run: python3 sanguo-town/checkpoints/life072/apply-ui02.py
      - name: Native Debug and Release runtime and client tests
        working-directory: sanguo-town
        run: |
          set -euo pipefail
          mkdir -p dist/life-v072
          { sw_vers; uname -m; xcodebuild -version; swift --version; } | tee dist/life-v072/environment.txt
          swift test 2>&1 | tee dist/life-v072/debug.txt
          swift build --product SanguoMac 2>&1 | tee dist/life-v072/client.txt
          swift test -c release 2>&1 | tee dist/life-v072/release.txt
      - name: Same simulation with different visit cadence and recorded city preview
        working-directory: sanguo-town
        run: |
          set -euo pipefail
          swift run -c release SanguoLifeCLI --seconds 86400 --cadence 120 --seal --preview --output dist/life-v072/day1 2>&1 | tee dist/life-v072/day1.txt
          swift run -c release SanguoLifeCLI --seconds 86400 --cadence 86400 --seal --output dist/life-v072/day1-once 2>&1 | tee dist/life-v072/day1-once.txt
          cmp dist/life-v072/day1/world.json dist/life-v072/day1-once/world.json
          swift run -c release SanguoLifeCLI --seconds 604800 --cadence 86400 --seal --output dist/life-v072/day7 2>&1 | tee dist/life-v072/day7.txt
      - name: Build and relocate actual development app
        working-directory: sanguo-town
        run: |
          set -euo pipefail
          bash scripts/build-macos.sh 2>&1 | tee dist/life-v072/app-build.txt
          mkdir -p /tmp/sanguo-relocated
          ditto dist/SanguoTown-Development.app /tmp/sanguo-relocated/SanguoTown-Development.app
          (cd /tmp; /tmp/sanguo-relocated/SanguoTown-Development.app/Contents/MacOS/SanguoMac --life-catalog-check) | tee dist/life-v072/relocated-bundle.txt
          codesign --verify --deep --strict /tmp/sanguo-relocated/SanguoTown-Development.app
          ditto -c -k --keepParent dist/SanguoTown-Development.app dist/life-v072/SanguoTown-Development.zip
      - name: Commit verified source on feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sanguo-town/Package.swift sanguo-town/Sources/SanguoLife sanguo-town/Sources/SanguoLifeVisual sanguo-town/Sources/SanguoLifeCLI sanguo-town/Sources/SanguoMac/LifeScene.swift sanguo-town/Sources/SanguoMac/LifeViews.swift sanguo-town/Sources/SanguoMac/SanguoMacApp.swift sanguo-town/Tests/SanguoLifeTests sanguo-town/scripts/build-macos.sh
          git commit -m 'feat(life): ship playable task-driven city, desktop scene, codex and isolated persistent save'
          current=$(git ls-remote origin refs/heads/feat/sanguo-life-runtime-v072 | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/sanguo-life-runtime-v072
          git rev-parse HEAD > sanguo-town/dist/life-v072/commit.txt
          git archive --format=zip --output=sanguo-town/dist/life-v072/source.zip HEAD sanguo-town
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanguo-life-v072-playable-${{ github.sha }}
          path: sanguo-town/dist/life-v072
          retention-days: 14
          if-no-files-found: warn
