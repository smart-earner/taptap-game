name: Sanguo verified civic integration
on:
  push:
    branches: ['feat/sanguo-city-growth']
    paths:
      - 'sanguo-town/checkpoints/batch-03/**'
      - '.github/workflows/sanguo-integrate-visuals.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'smart-earner/taptap-game' && github.ref == 'refs/heads/feat/sanguo-city-growth'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 10
      - name: Apply fixed reviewed batch to unchanged verified core
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d61d3a8c2212d267516c8fc544c9bbd23619339c HEAD -- sanguo-town/Sources sanguo-town/Tests sanguo-town/scripts/build-macos.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sanguo-town/checkpoints/batch-03/visual-fixes.patch')
          s=p.read_text().replace('\n diff --git ', '\ndiff --git ')
          Path('/tmp/civic-verified.patch').write_text(s)
          PY
          git apply --unidiff-zero --check /tmp/civic-verified.patch
          git apply --unidiff-zero /tmp/civic-verified.patch
          cp sanguo-town/checkpoints/batch-03/CivicTownArt.swift sanguo-town/Sources/SanguoPresentation/
          cp sanguo-town/checkpoints/batch-03/RealmViews.swift sanguo-town/Sources/SanguoMac/
          cp sanguo-town/checkpoints/batch-03/CivicPresentationTests.swift sanguo-town/Tests/SanguoPresentationTests/
          mkdir -p /tmp/town-batch-03/logs
          { sw_vers; uname -m; xcodebuild -version; swift --version; } | tee /tmp/town-batch-03/logs/environment.txt
          test "$(uname -m)" = arm64
      - name: Test native SDK and long-horizon rules
        working-directory: sanguo-town
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee /tmp/town-batch-03/logs/debug-tests.log
          swift test -c release 2>&1 | tee /tmp/town-batch-03/logs/release-tests.log
          swift run -c release SanguoGrowth --town --matrix --output /tmp/town-batch-03/matrix 2>&1 | tee /tmp/town-batch-03/logs/matrix.log
          swift run -c release SanguoGrowth --town --days 90 --cadence 3 --legion 60 --output /tmp/town-batch-03/preview 2>&1 | tee /tmp/town-batch-03/logs/preview.log
          bash scripts/build-macos.sh 2>&1 | tee /tmp/town-batch-03/logs/app-build.log
          ditto -c -k --keepParent dist/SanguoTown-Development.app /tmp/town-batch-03/SanguoTown-Development.zip
      - name: Commit verified integration to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- sanguo-town/Sources sanguo-town/Tests/SanguoPresentationTests/CivicPresentationTests.swift sanguo-town/scripts/build-macos.sh
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith('sanguo-town/Sources/') or p in ('sanguo-town/Tests/SanguoPresentationTests/CivicPresentationTests.swift','sanguo-town/scripts/build-macos.sh') for p in paths), paths
          PY
          test "$(git ls-remote origin refs/heads/feat/sanguo-city-growth | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sanguo): integrate civic scenery, light management UI and historical snapshots'
          git push origin HEAD:refs/heads/feat/sanguo-city-growth
          git rev-parse HEAD > /tmp/town-batch-03/verified-commit.txt
          git archive --format=zip --output=/tmp/town-batch-03/source.zip HEAD sanguo-town
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: town-batch-03-${{ github.sha }}
          path: /tmp/town-batch-03
          retention-days: 14
          if-no-files-found: error
