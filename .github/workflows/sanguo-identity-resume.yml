name: Sanguo identity pause-resume regression
on:
  push:
    branches: [feat/sanguo-city-identity]
    paths: ['sanguo-town/checkpoints/town-0.5/resume.patch', '.github/workflows/sanguo-identity-resume.yml']
permissions:
  contents: read
concurrency:
  group: sanguo-identity-resume
  cancel-in-progress: false
jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'fixstage(identity-resume):')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply only the reviewed three-file resume fix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/sanguo-city-identity
          test "$(git hash-object sanguo-town/Sources/SanguoCore/CityIdentity.swift)" = 658ab7627ca6a1cbbc402404c1967ff2b8528405
          test "$(git hash-object sanguo-town/Tests/SanguoCoreTests/CityIdentityTests.swift)" = 2b43eb605b7b07edb405f784807a0b629004b3e0
          test "$(git hash-object sanguo-town/Sources/SanguoMac/CityGrowthViews.swift)" = eec2c1d0c95644eba892c62b0470ba49434f79ef
          git apply --check sanguo-town/checkpoints/town-0.5/resume.patch
          git apply sanguo-town/checkpoints/town-0.5/resume.patch
      - name: Native regression and final development bundle
        working-directory: sanguo-town
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/resume/logs
          { sw_vers; uname -m; xcodebuild -version; swift --version; } | tee dist/resume/logs/environment.txt
          test "$(uname -m)" = arm64
          python3 scripts/validate_spec.py | tee dist/resume/logs/spec.json
          swift test 2>&1 | tee dist/resume/logs/debug.txt
          swift test -c release 2>&1 | tee dist/resume/logs/release.txt
          swift build --product SanguoMac 2>&1 | tee dist/resume/logs/mac.txt
          swift run -c release SanguoGrowth --identity --matrix --output dist/resume/matrix 2>&1 | tee dist/resume/logs/matrix.txt
          bash scripts/build-macos.sh 2>&1 | tee dist/resume/logs/app.txt
          ditto -c -k --keepParent dist/SanguoTown-Development.app dist/resume/SanguoTown-Development.zip
      - name: Commit only tested source files to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add sanguo-town/Sources/SanguoCore/CityIdentity.swift sanguo-town/Tests/SanguoCoreTests/CityIdentityTests.swift sanguo-town/Sources/SanguoMac/CityGrowthViews.swift
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sanguo): resume standing city governance without resetting paid plans'
          git push origin HEAD:"$GITHUB_REF_NAME"
          git rev-parse HEAD > sanguo-town/dist/resume/verified-commit.txt
          git archive --format=zip HEAD sanguo-town > sanguo-town/dist/resume/verified-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: identity-resume-${{ github.sha }}
          path: sanguo-town/dist/resume
          retention-days: 14
