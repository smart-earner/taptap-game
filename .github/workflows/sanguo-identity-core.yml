name: Sanguo city identity core integration
on:
  push:
    branches: [feat/sanguo-city-identity]
    paths: ['sanguo-town/checkpoints/town-0.5/**', '.github/workflows/sanguo-identity-core.yml']
permissions:
  contents: read
concurrency:
  group: sanguo-identity-core
  cancel-in-progress: false
jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'stage(identity-core):')
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Apply only the reviewed patch and source files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/sanguo-city-identity
          test "$(git hash-object sanguo-town/checkpoints/town-0.5/CityIdentity.swift)" = 658ab7627ca6a1cbbc402404c1967ff2b8528405
          test "$(git hash-object sanguo-town/checkpoints/town-0.5/CityIdentityTests.swift)" = 2b43eb605b7b07edb405f784807a0b629004b3e0
          sed 's/^ diff --git/diff --git/' sanguo-town/checkpoints/town-0.5/core.patch > /tmp/core-reviewed.patch
          git apply --check /tmp/core-reviewed.patch
          git apply /tmp/core-reviewed.patch
          cp sanguo-town/checkpoints/town-0.5/CityIdentity.swift sanguo-town/Sources/SanguoCore/CityIdentity.swift
          cp sanguo-town/checkpoints/town-0.5/CityIdentityTests.swift sanguo-town/Tests/SanguoCoreTests/CityIdentityTests.swift
      - name: Native regression and SDK build
        working-directory: sanguo-town
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/identity-core
          { sw_vers; uname -m; xcodebuild -version; swift --version; } | tee dist/identity-core/environment.txt
          swift test 2>&1 | tee dist/identity-core/debug.txt
          swift test -c release 2>&1 | tee dist/identity-core/release.txt
          swift build --product SanguoMac 2>&1 | tee dist/identity-core/mac-build.txt
      - name: Commit verified core to feature branch, never main
        shell: bash
        run: |
          set -euo pipefail
          git add sanguo-town/Sources/SanguoCore/CityIdentity.swift sanguo-town/Tests/SanguoCoreTests/CityIdentityTests.swift sanguo-town/Sources/SanguoCore/CityGrowth.swift sanguo-town/Sources/SanguoCore/GrowthRuntime.swift sanguo-town/Sources/SanguoCore/RealmDevelopment.swift sanguo-town/Sources/SanguoCore/RealmRuntime.swift sanguo-town/Sources/SanguoCore/Validation.swift
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 7
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(sanguo): integrate consented city profiles and explainable civic planner'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: identity-core-${{ github.sha }}
          path: sanguo-town/dist/identity-core
          retention-days: 14
