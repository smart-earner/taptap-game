name: Sanguo hero v0.7.1 specification integration
on:
  push:
    branches: ['docs/sanguo-hero-v071']
    paths: ['.github/workflows/sanguo-hero-v071-integrate.yml']
permissions:
  contents: write
concurrency:
  group: sanguo-hero-v071-spec-integration
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  integrate:
    if: github.ref == 'refs/heads/docs/sanguo-hero-v071'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only reviewed PRD data and text
        shell: bash
        run: |
          set -euo pipefail
          python3 sanguo-town/checkpoints/hero-v071/01_data.py
          python3 sanguo-town/checkpoints/hero-v071/02_docs.py
          python3 sanguo-town/checkpoints/hero-v071/03_checks.py
          # The limited CI token does not edit workflows; an authorized manual commit handles that separately.
          git restore -- .github/workflows/sanguo-prd-v07.yml
          git diff --exit-code -- .github sanguo-town/Sources sanguo-town/Tests sanguo-town/Package.swift
      - name: Validate reference formulas and the complete specification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/hero-v071
          python3 --version | tee dist/hero-v071/environment.txt
          python3 sanguo-town/scripts/validate_hero_v071.py --output dist/hero-v071 2>&1 | tee dist/hero-v071/hero-check.log
          python3 sanguo-town/scripts/validate_prd_v07.py --output dist/hero-v071 2>&1 | tee dist/hero-v071/spec-check.log
          python3 sanguo-town/scripts/check_prd_v07_delivery.py --output dist/hero-v071 2>&1 | tee dist/hero-v071/delivery-check.log
      - name: Record evidence and publish to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          root=Path('sanguo-town'); out=Path('dist/hero-v071')
          h=json.loads((out/'hero-validation.json').read_text()); b=json.loads((out/'validation.json').read_text()); d=json.loads((out/'delivery-validation.json').read_text())
          assert h['failed']==h['errors']==b['failed']==d['failed']==0
          for p in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines():
              assert p.startswith(('sanguo-town/docs/','sanguo-town/spec/','sanguo-town/scripts/')) or p=='sanguo-town/README.md',p
          run=os.environ['GITHUB_RUN_ID']; sha=os.environ['GITHUB_SHA']
          report={'spec_version':'0.7.1','integration_input_commit':sha,'workflow_run':int(run),'scope':'specifications_and_Python_reference_arithmetic','hero_tests':h,'base_checks_passed':b['passed'],'delivery_checks_passed':d['passed'],'runtime_sources_modified':False,'Swift_ability_system_integrated':False,'application_acceptance_executed':0}
          (root/'docs/life-v0.7/hero-validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          text=f"# PRD v0.7.1 四维与技能库验证记录\n\n本次是人物规格与Python参考实现验证，不是Swift游戏发布。软件仍town-0.5＋desktop-0.1。\n\n验证输入提交：`{sha}`。\n[实际运行记录](https://github.com/smart-earner/taptap-game/actions/runs/{run})\n\n|检查|结果|范围|\n|---|---:|---|\n|能力配置与参考计算|{h['tests_run']}测试通过|四维、1—5技能、叠加、任职、重命名一致性|\n|基础规格与数值参照|{b['passed']}通过，0失败|不是新城市引擎|\n|跨文件、开局和全文导出|{d['passed']}通过，0失败|包含能力专章和第四份技能配置|\n|新生活版应用验收|72项，全部NOT_RUN|不以参考计算代替|\n|M4实机与新生活引擎|NOT_RUN|未改Sources、Tests、Package.swift|\n\n人物数据已移除内嵌prefect/commander效果与按姓名的policy_fit；能力通过skill_id解析。反例是测试方法内的多组输入，不重复计成游戏测试。Python参考器还未与Swift世界状态、存档迁移或原生技能UI集成。当前存档不被修改，作物/饭食/城建/军粮基础参数不变。\n\n## 复现\n\n```sh\ncd sanguo-town\npython3 scripts/validate_hero_v071.py --output dist/prd-v07\npython3 scripts/validate_prd_v07.py --output dist/prd-v07\npython3 scripts/check_prd_v07_delivery.py --output dist/prd-v07\n```\n\n上一版0.7.0记录保存在Git历史；旧519/54规格检查及客户端201项运行测试都不代替本轮能力系统验收。CI仅提交到人物规格分支，不自动修改main；经回读核对后再手动合入。\n"
          (root/'docs/life-v0.7/VALIDATION.md').write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- sanguo-town/docs sanguo-town/spec sanguo-town/scripts sanguo-town/README.md
          git add sanguo-town/spec/hero-system-v0.7.json sanguo-town/docs/life-v0.7/hero-validation.json
          git diff --cached --exit-code -- .github sanguo-town/Sources sanguo-town/Tests sanguo-town/Package.swift
          git commit -m 'docs(hero): integrate verified four attributes and reusable skills into PRD v0.7.1'
          current=$(git ls-remote origin refs/heads/docs/sanguo-hero-v071 | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/docs/sanguo-hero-v071
          git rev-parse HEAD > dist/hero-v071/commit.txt
          git archive --format=zip --output=dist/hero-v071/source.zip HEAD sanguo-town/docs sanguo-town/spec sanguo-town/scripts sanguo-town/README.md .github/workflows/sanguo-prd-v07.yml
          sha256sum dist/hero-v071/source.zip > dist/hero-v071/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanguo-hero-v071-${{ github.sha }}
          path: dist/hero-v071
          retention-days: 14
          if-no-files-found: warn
